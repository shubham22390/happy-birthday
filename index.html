<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Cutie! — A Birthday Story</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-page">
  <button class="music-toggle" type="button" aria-pressed="false" aria-label="Play Blue by yung kai">
    <span aria-hidden="true">♫</span><span class="music-label">Play Blue</span>
  </button>
  <p class="music-status" role="status" aria-live="polite"></p>

  <main class="welcome-frame" aria-labelledby="birthday-title">
    <div class="welcome-interior">
      <aside class="welcome-sticker sticker-cat-left" aria-hidden="true">
        <span class="sticker-cat">&#x1F431;</span><span class="sticker-glasses">&#x1F576;&#xFE0F;</span>
      </aside>

      <section class="welcome-content">
        <div class="hello-bubble">
          <h1 id="birthday-title">Hello Cutie!</h1>
          <p>I made this especially for you <span aria-hidden="true">&#x1F497;</span></p>
        </div>

        <div class="welcome-gift" aria-hidden="true">
          <span class="gift-bow"></span><span class="gift-knot"></span>
          <span class="gift-lid"></span><span class="gift-body"><span>♥</span></span>
        </div>

        <a class="welcome-open" href="wishes.html">Click To Open <span aria-hidden="true">&#x2192;</span></a>
      </section>

      <aside class="welcome-sticker sticker-cat-right" aria-hidden="true">
        <span class="sticker-cat">&#x1F431;</span><span class="sticker-bow">&#x1F380;</span><span class="sticker-flowers">&#x1F490;</span>
      </aside>
    </div>
  </main>

  <script src="page-transitions.js"></script>
  <script src="music.js"></script>
</body>
</html>
