<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Birthday Story ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="journey-page welcome-page">
  <div class="celebration-sky" aria-hidden="true">
    <i class="balloon balloon-one"></i><i class="balloon balloon-two"></i><i class="balloon balloon-three"></i>
    <b class="star star-one">✦</b><b class="star star-two">✦</b><b class="star star-three">♥</b>
  </div>
  <main class="story-card" aria-labelledby="birthday-title">
    <p class="step">Birthday story · 1 of 4</p>
    <div class="mini-cake" aria-hidden="true"><i></i><span></span><b></b></div>
    <p class="kicker">Today is completely yours</p>
    <h1 id="birthday-title">Happy Birthday,<br><em>Sister!</em> 🎉</h1>
    <p class="lead">A little four-part celebration filled with love, memories, and a wish just for you.</p>
    <button class="primary-button confetti-button" type="button">Start the celebration <span>→</span></button>
    <a class="text-link" href="wishes.html">Or skip to your birthday wishes</a>
  </main>
  <div class="confetti" aria-hidden="true"></div>
  <script src="logic.js"></script>
</body>
</html>
