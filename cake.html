<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Birthday Wish ✨</title>
    <link rel="stylesheet" href="cake.css">
</head>
<body>
    <div class="corner-stickers" aria-hidden="true">
        <span class="corner-sticker sticker-balloon">🎈</span>
        <span class="corner-sticker sticker-star">⭐</span>
        <span class="corner-sticker sticker-gift">🎁</span>
        <span class="corner-sticker sticker-heart">💖</span>
    </div>
    <button class="music-toggle" type="button" aria-pressed="false" aria-label="Play birthday song">
        <span aria-hidden="true">♫</span><span class="music-label">Play song</span>
    </button>
    <p class="music-status" role="status" aria-live="polite"></p>
    <main class="wish-card" aria-labelledby="wish-title">
        <a class="back-link" href="memories.html">← Back to your memories</a>
        <p class="story-step">Birthday story · 4 of 4</p>
        <p class="eyebrow">Close your eyes for a moment</p>
        <h1 id="wish-title">Make a wish! <span>✨</span></h1>
        <p class="instruction">When you are ready, blow out all five candles and send your wish into the stars.</p>

        <div class="cake-scene" aria-label="A birthday cake with five lit candles">
            <div class="spark spark-one">✦</div><div class="spark spark-two">✦</div><div class="spark spark-three">♥</div>
            <div class="birthday-cake" id="birthdayCake">
                <div class="candles" aria-hidden="true">
                    <div class="candle candle-one"><i class="flame"></i></div>
                    <div class="candle candle-two"><i class="flame"></i></div>
                    <div class="candle candle-three"><i class="flame"></i></div>
                    <div class="candle candle-four"><i class="flame"></i></div>
                    <div class="candle candle-five"><i class="flame"></i></div>
                </div>
                <div class="frosting"><span></span><span></span><span></span><span></span><span></span></div>
                <div class="cake-layer top-layer"></div>
                <div class="cake-layer bottom-layer"><i></i><i></i><i></i><i></i></div>
                <div class="plate"></div>
            </div>
            <div class="smoke" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <button id="blowButton" type="button">Blow the candles 💨</button>
        <p class="wish-message" id="wishMessage" aria-live="polite">Five little flames are waiting for your big wish.</p>
        <button id="againButton" class="again-button" type="button" hidden>Light them again 🔥</button>
    </main>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <script src="cake.js"></script>
    <script src="page-transitions.js"></script>
    <script src="music.js"></script>
</body>
</html>
