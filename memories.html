<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Beautiful Smile — Our Memories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-page memories-showcase-page">
  <button class="music-toggle" type="button" aria-pressed="false" aria-label="Play Blue by yung kai">
    <span aria-hidden="true">♫</span><span class="music-label">Play Blue</span>
  </button>
  <p class="music-status" role="status" aria-live="polite"></p>

  <main class="welcome-frame memories-frame" aria-labelledby="memories-title">
    <div class="welcome-interior memories-interior">
      <h1 class="memories-title" id="memories-title">YOUR BEAUTIFUL SMILE!</h1>

      <section class="memories-showcase" aria-label="Photo memories">
        <div class="memory-cat-illustration" aria-hidden="true">
          <span class="memory-cat-face">&#x1F431;</span><span class="memory-cat-point">&#x1F449;</span>
        </div>
        <figure class="showcase-photo">
          <img id="showcaseImage" class="showcase-image" src="844189586_1136011786044518_1339667936298903296_n.jpg" alt="Playful sideways selfie in an orange patterned outfit">
        </figure>
      </section>

      <div class="memories-controls">
        <span class="memory-count" id="memoryCount" aria-live="polite">1 / 3</span>
        <a class="welcome-open" id="nextPhoto" href="cake.html">Next <span aria-hidden="true">&#x2192;</span></a>
      </div>
      <a class="memory-back" href="wishes.html">&#x2190; Back</a>
    </div>
  </main>

  <script src="memories.js"></script>
  <script src="page-transitions.js"></script>
  <script src="music.js"></script>
