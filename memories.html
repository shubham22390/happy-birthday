<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Happy Memories 📸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="journey-page">
  <div class="corner-stickers" aria-hidden="true">
    <span class="corner-sticker sticker-balloon">🎈</span>
    <span class="corner-sticker sticker-star">⭐</span>
    <span class="corner-sticker sticker-gift">🎁</span>
    <span class="corner-sticker sticker-heart">💖</span>
  </div>
  <button class="music-toggle" type="button" aria-pressed="false" aria-label="Play birthday song">
    <span aria-hidden="true">♫</span><span class="music-label">Play song</span>
  </button>
  <p class="music-status" role="status" aria-live="polite"></p>
  <div class="celebration-sky" aria-hidden="true"><i class="balloon balloon-one"></i><i class="balloon balloon-three"></i><b class="star star-two">✦</b><b class="star star-three">♥</b></div>
  <main class="story-card memory-card" aria-labelledby="memories-title">
    <p class="step">Birthday story · 3 of 4</p>
    <header class="page-heading"><p class="kicker">The little moments</p><h1 id="memories-title">Our favorite<br><em>memories</em> 📸</h1><p class="lead">Every picture holds a tiny piece of our story.</p></header>
    <!-- Photos added to this project by the user. -->
    <section class="memory-grid" aria-label="Four photo memories">
      <figure class="memory"><img class="photo photo-one" src="843299033_1840528766943027_5896812495667966450_n.jpg" alt="Smiling selfie with friends in a red outfit" loading="lazy"><figcaption>Our happiest day</figcaption></figure>
      <figure class="memory"><img class="photo photo-two" src="844189586_1136011786044518_1339667936298903296_n.jpg" alt="Playful sideways selfie in an orange patterned outfit" loading="lazy"><figcaption>That silly laugh</figcaption></figure>
      <figure class="memory"><img class="photo photo-three" src="846206971_1610883437193957_4491076504340182431_n.jpg" alt="Portrait in a blue patterned outfit with heart stickers" loading="lazy"><figcaption>A day to remember</figcaption></figure>
      <figure class="memory"><img class="photo photo-four" src="847452556_2637587086691244_3143761521648707467_n.jpg" alt="Portrait in red in front of a red curtain" loading="lazy"><figcaption>Always together</figcaption></figure>
    </section>
    <p class="photo-note">Four little moments from our story.</p>
    <a class="next-link" href="cake.html">One final surprise <span>→</span></a>
    <a class="back-link" href="wishes.html">← Read the wishes again</a>
  </main>
  <script src="page-transitions.js"></script>
  <script src="music.js"></script>

</html>
